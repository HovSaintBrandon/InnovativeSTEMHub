<section id="development" class="section development">
  <div class="container">
    <div class="section__head">
      <h2>Professional development</h2>
    </div>

    <div class="development__columns">
      <div class="development__column">
        <h3>Certifications</h3>
        <ul>
          @for (item of certifications; track item) {
            <li>{{ item }}</li>
          }
        </ul>
      </div>

      <div class="development__column">
        <h3>Conferences &amp; workshops</h3>
        <ul>
          @for (item of conferences; track item) {
            <li>{{ item }}</li>
          }
        </ul>
      </div>
    </div>
  </div>
</section>
