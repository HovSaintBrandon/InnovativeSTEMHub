<section class="page section admin-login">
  <div class="container admin-login__container">
    <h1>Sign in</h1>
    <p>For Dr. Mutende &mdash; manage the homepage photo, research, reading list, and blog.</p>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" autocomplete="username" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" formControlName="password" autocomplete="current-password" />
      </div>

      <button class="btn btn--primary" type="submit" [disabled]="status() === 'signing-in'">
        @if (status() === 'signing-in') {
          Signing in&hellip;
        } @else {
          Sign in
        }
      </button>

      @if (status() === 'error') {
        <p class="admin-login__error">That email and password combination wasn't recognized.</p>
      }
    </form>
  </div>
</section>
